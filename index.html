        let ASSET_PREFIX = './assets/aistudio/';

          return ASSET_PREFIX + filename;
        }

        function escapeHtml(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        // =========================================================================
        // 2. WEB AUDIO API FEEDBACK
        // =========================================================================
        const soundFX = {
          ctx: null,
          enabled: true,
          getContext() {
            if (!this.enabled) return null;
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return this.ctx;
          },
          playChoice() {
            const ctx = this.getContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.17);
          },
          playDistrictUnlock() {
            const ctx = this.getContext();
            if (!ctx) return;
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const now = ctx.currentTime + idx * 0.07;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.05, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.26);
            });
          },
          playFestivalReveal() {
            const ctx = this.getContext();
            if (!ctx) return;
            [440, 554.37, 659.25, 880].forEach((freq, idx) => {
              const now = ctx.currentTime + idx * 0.08;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.06, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.42);
            });
          },
        };

        function getUnlockedDistrictsAfterCh2(scores) {
          const sorted = [...TRACK_ORDER].sort((a, b) => scores[b] - scores[a]);
          if (scores[sorted[0]] - scores[sorted[1]] <= 1 && scores[sorted[1]] > 0) {
            return [sorted[0], sorted[1]];
          }
          return [sorted[0]];
        }

        function calculateOutcome(scores, tieBreakerTrack, careerFocusKey, unlockedDistrictsInCh3) {
          const sorted = [...TRACK_ORDER].sort((a, b) => {
            if (scores[b] !== scores[a]) return scores[b] - scores[a];
            if (a === tieBreakerTrack) return -1;
            if (b === tieBreakerTrack) return 1;
            return TRACK_ORDER.indexOf(a) - TRACK_ORDER.indexOf(b);
          });
          const primaryTrack = TRACKS[sorted[0]];
          const diff = scores[sorted[0]] - scores[sorted[1]];
          const isHybrid = diff <= 1 && scores[sorted[1]] > 0;
          const secondaryTrack = isHybrid ? TRACKS[sorted[1]] : null;
          const hybridTitle = secondaryTrack
            ? `${primaryTrack.personaTitle} × ${secondaryTrack.personaTitle}`
            : null;

          let orderedCareers = [...primaryTrack.careers];
          if (careerFocusKey && orderedCareers.includes(careerFocusKey)) {
            orderedCareers = [
              careerFocusKey,
              ...orderedCareers.filter((c) => c !== careerFocusKey),
            ];
          }
          return {
            scores,
            primaryTrack,
            secondaryTrack,
            isHybrid,
            hybridTitle,
            orderedCareers,
            unlockedDistrictsInCh3,
          };
        }

        function loadCanvasImg(src) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
          });
        }
        function roundRectPath(ctx, x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }
        async function generateShareCardPng(outcome, nickname) {
          const width = 1080, height = 1920;
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0F172A';
          ctx.fillRect(0, 0, width, height);

          const g1 = ctx.createRadialGradient(860, 320, 20, 860, 320, 600);
          g1.addColorStop(0, 'rgba(236, 72, 153, 0.28)');
          g1.addColorStop(1, 'rgba(15, 23, 42, 0)');
          ctx.fillStyle = g1;
          ctx.fillRect(0, 0, width, height);

          const g2 = ctx.createRadialGradient(220, 1480, 20, 220, 1480, 620);
          g2.addColorStop(0, 'rgba(56, 189, 248, 0.22)');
          g2.addColorStop(1, 'rgba(15, 23, 42, 0)');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, width, height);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
          ctx.lineWidth = 2;
          roundRectPath(ctx, 44, 44, width - 88, height - 88, 36);
          ctx.stroke();

          try {
            const logoImg = await loadCanvasImg(imgUrl(LOGO_FILE));
            ctx.save();
            roundRectPath(ctx, width - 296, 86, 200, 125, 16);
            ctx.clip();
            ctx.drawImage(logoImg, width - 310, 68, 228, 170);
            ctx.restore();
          } catch (_) {}

          ctx.fillStyle = '#38BDF8';
          ctx.font = '600 26px "Outfit", "IBM Plex Sans Thai", sans-serif';
          ctx.fillText('IMAGINE CITY · SCHOOL OF DIGITAL MEDIA', 96, 130);

          const explorerName = (nickname || '').trim() || 'นักเดินทางแห่งแสงสี';
          ctx.fillStyle = '#94A3B8';
          ctx.font = '500 30px "IBM Plex Sans Thai", sans-serif';
          ctx.fillText(`บัตรผลลัพธ์ของ ${explorerName}`, 96, 184);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '700 62px "IBM Plex Sans Thai", "Outfit", sans-serif';
          ctx.fillText(outcome.primaryTrack.personaTitle, 96, 278);

          ctx.fillStyle = outcome.isHybrid && outcome.secondaryTrack ? '#F472B6' : '#CBD5E1';
          ctx.font = '600 34px "IBM Plex Sans Thai", sans-serif';
          ctx.fillText(
            outcome.isHybrid && outcome.secondaryTrack
              ? `สายผสม: ผสานพลังกับ ${outcome.secondaryTrack.personaTitle}`
              : outcome.primaryTrack.districtName,
            96,
            336
          );

          const centerX = width / 2, portraitY = 665, radius = 250;
          ctx.save();
          ctx.beginPath();
          ctx.arc(centerX, portraitY, radius + 14, 0, Math.PI * 2);
          ctx.strokeStyle = outcome.primaryTrack.accentHex;
          ctx.lineWidth = 5;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(centerX, portraitY, radius, 0, Math.PI * 2);
          const pGrad = ctx.createRadialGradient(centerX, portraitY - 25, 20, centerX, portraitY, radius);
          pGrad.addColorStop(0, 'rgba(248, 250, 252, 0.28)');
          pGrad.addColorStop(0.58, `${outcome.primaryTrack.accentHex}44`);
          pGrad.addColorStop(1, '#0B1120');
          ctx.fillStyle = pGrad;
          ctx.fill();

          try {
            const charImg = await loadCanvasImg(imgUrl(outcome.primaryTrack.character.file));
            const drawSize = radius * 2.05;
            ctx.drawImage(charImg, centerX - drawSize / 2, portraitY - drawSize / 2 + 10, drawSize, drawSize);
          } catch (_) {}
          ctx.restore();

          ctx.textAlign = 'center';
          ctx.fillStyle = '#E2E8F0';
          ctx.font = '600 30px "IBM Plex Sans Thai", sans-serif';
          ctx.fillText(`เพื่อนร่วมทางประจำตัว: ${outcome.primaryTrack.character.name}`, centerX, 975);
          ctx.fillStyle = '#94A3B8';
          ctx.font = '500 26px "Outfit", "IBM Plex Sans Thai", sans-serif';
          ctx.fillText(`${outcome.primaryTrack.majorName} (${outcome.primaryTrack.code})`, centerX, 1020);
          ctx.textAlign = 'left';

          ctx.fillStyle = 'rgba(30, 41, 59, 0.72)';
          roundRectPath(ctx, 88, 1070, width - 176, 355, 24);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#F8FAFC';

            roundRectPath(ctx, barX, y - 20, barW, 22, 11);
            ctx.fill();
            const fillW = Math.max(16, (score / Math.max(5, maxScore)) * barW);
            ctx.fillStyle = t.accentHex;
            roundRectPath(ctx, barX, y - 20, fillW, 22, 11);
            ctx.fill();
            ctx.fillStyle = '#F8FAFC';
            ctx.font = '600 24px "JetBrains Mono", monospace';
            ctx.fillText(`${score} pt`, barX + barW + 24, y);
          });

          ctx.fillStyle = 'rgba(30, 41, 59, 0.72)';
          roundRectPath(ctx, 88, 1455, width - 176, 290, 24);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.stroke();

          ctx.fillStyle = '#38BDF8';
          ctx.font = '600 28px "IBM Plex Sans Thai", sans-serif';

          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getCurrentScene() {
          if (state.stepIndex < 5) return SCENES[state.stepIndex];
          if (state.stepIndex === 5) return buildDistrictScene31(state.unlockedDistricts);
          return SCENES[state.stepIndex - 1];
        }

        function commitChoice(choice) {
          if (state.advanceTimer) {
            clearTimeout(state.advanceTimer);
            state.advanceTimer = null;
          }
          const scene = getCurrentScene();
          state.scores[choice.track] += 1;
          state.history.push({ sceneIndex: state.stepIndex, choice });
          if (choice.careerFocusKey) state.careerFocusKey = choice.careerFocusKey;
          if (scene.isTieBreaker) state.tieBreakerTrack = choice.track;
          state.lastReaction = choice.reactionQuote;
          state.selectedChoice = null;

          if (state.stepIndex === 4) {
            state.unlockedDistricts = getUnlockedDistrictsAfterCh2(state.scores);
            soundFX.playDistrictUnlock();
            state.showDistrictUnlockModal = true;
            render();
            return;

          if (state.stepIndex === 10) {
            soundFX.playFestivalReveal();
            state.outcome = calculateOutcome(
              { ...state.scores },
              state.tieBreakerTrack,
              state.careerFocusKey,
              state.unlockedDistricts
            );
            state.view = 'PASS_GATE';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          state.stepIndex += 1;
          render();
        }

        // =========================================================================
        // 8. MAIN RENDER & DELEGATED EVENT HANDLERS
        // =========================================================================
        const appEl = document.getElementById('app');

        function render() {
          let bodyHtml = '';
          if (state.view === 'LANDING') bodyHtml = renderLanding();
          else if (state.view === 'QUIZ') bodyHtml = renderQuiz();
          else if (state.view === 'PASS_GATE') bodyHtml = renderPassGate();
          else if (state.view === 'RESULT') bodyHtml = renderResult();

          appEl.innerHTML = renderNavbar() + `<div class="flex-1">${bodyHtml}</div>`;
          bindFormListeners();
        }

        function bindFormListeners() {
          const form = document.getElementById('pass-form');
          if (!form) return;

          const syncField = (id, key) => {
            const el = document.getElementById(id);
            if (el) {
              el.addEventListener('input', (e) => {
                state.passForm[key] = e.target.value;
                state.passForm.errorMsg = null;
              });
              el.addEventListener('change', (e) => {
                state.passForm[key] = e.target.value;
                if (id === 'exp-contact-type') render();
              });
            }
          };
          syncField('exp-nickname', 'nickname');
          syncField('exp-grade', 'gradeLevel');
          syncField('exp-plan', 'studyPlan');
          syncField('exp-province', 'province');
          syncField('exp-channel', 'discoveryChannel');
          syncField('exp-stage', 'decisionStage');
          syncField('exp-exp', 'creativeExperience');
          syncField('exp-contact-type', 'contactChannel');
          syncField('exp-contact-value', 'contactValue');

          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = (state.passForm.contactValue || '').trim();
            if (val) {
              if (state.passForm.contactChannel === 'อีเมล' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
                state.passForm.errorMsg = 'กรุณากรอกรูปแบบอีเมลให้ถูกต้อง (เช่น name@example.com)';
                render();
                return;
              }
              if (state.passForm.contactChannel === 'เบอร์โทรศัพท์' && !/^[0-9+\-\s]{9,15}$/.test(val)) {
                state.passForm.errorMsg = 'กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (9–15 หลัก)';
                render();
                return;
              }
            }
            state.passForm.submitted = true;
            state.passForm.nickname = (state.passForm.nickname || '').trim() || 'นักเดินทางแห่งแสงสี';
            state.passForm.errorMsg = null;
            state.view = 'RESULT';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }

        appEl.addEventListener('click', (e) => {
          const heroBtn = e.target.closest('[data-hero-companion]');
          if (heroBtn) {
            const id = heroBtn.getAttribute('data-hero-companion');
            state.selectedCompanion = id;
            state.heroLightPercent = id === 'DGA' ? 38 : id === 'DGD' ? 54 : id === 'IGD' ? 70 : id === 'AFX' ? 85 : 100;
            render();
            return;
          }

          const compBtn = e.target.closest('[data-select-companion]');
          if (compBtn) {
            state.selectedCompanion = compBtn.getAttribute('data-select-companion');
            render();
            return;
          }

          const tabBtn = e.target.closest('[data-district-tab]');
          if (tabBtn) {
            state.activeDistrictTab = tabBtn.getAttribute('data-district-tab');
            render();
            return;
          }

          const isoTile = e.target.closest('[data-iso-track]');
          if (isoTile) {
            state.activeDistrictTab = isoTile.getAttribute('data-iso-track');
            render();
            return;
          }

          const startWithBtn = e.target.closest('[data-start-with]');
          if (startWithBtn) {
            startQuiz(startWithBtn.getAttribute('data-start-with'));
            return;
          }

          const choiceBtn = e.target.closest('[data-choice-id]');
          if (choiceBtn) {
            const cid = choiceBtn.getAttribute('data-choice-id');
            const scene = getCurrentScene();
            const choice = scene.choices.find((c) => c.id === cid);
            if (!choice) return;
            if (state.selectedChoice) {
              commitChoice(state.selectedChoice);
              return;
            }
            soundFX.playChoice();
            state.selectedChoice = choice;
            render();
            state.advanceTimer = setTimeout(() => commitChoice(choice), 850);
            return;
          }

          const factorBtn = e.target.closest('[data-factor]');
          if (factorBtn) {
            const fac = factorBtn.getAttribute('data-factor');
            const arr = state.passForm.decisionFactors;
            if (arr.includes(fac)) {
              state.passForm.decisionFactors = arr.filter((x) => x !== fac);
            } else if (arr.length >= 2) {
              state.passForm.decisionFactors = [arr[1], fac];
            } else {
              state.passForm.decisionFactors = [...arr, fac];
            }
            render();
            return;
          }

          const actionEl = e.target.closest('[data-action]');
          if (!actionEl) return;
          const action = actionEl.getAttribute('data-action');

          if (action === 'go-home') {
            if (state.view !== 'LANDING') {
              e.preventDefault();
              if (state.advanceTimer) clearTimeout(state.advanceTimer);
              state.view = 'LANDING';
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          } else if (action === 'start-quiz') {
            startQuiz();
          } else if (action === 'commit-now' && state.selectedChoice) {
            commitChoice(state.selectedChoice);
          } else if (action === 'toggle-sound') {
            state.soundOn = !state.soundOn;
            soundFX.enabled = state.soundOn;
            render();
          } else if (action === 'enter-ch3') {
            soundFX.playChoice();
            state.showDistrictUnlockModal = false;
            state.stepIndex = 5;
            render();
          } else if (action === 'quiz-back') {
            if (state.advanceTimer) clearTimeout(state.advanceTimer);
            if (state.selectedChoice) {
              state.selectedChoice = null;
              render();
              return;
            }
            if (state.showDistrictUnlockModal) state.showDistrictUnlockModal = false;
            if (state.history.length === 0) {
              state.view = 'LANDING';
              render();
              return;
            }
            const last = state.history.pop();
            state.scores[last.choice.track] = Math.max(0, state.scores[last.choice.track] - 1);
            state.stepIndex = last.sceneIndex;
            state.lastReaction = null;
            render();
          } else if (action === 'skip-pass') {
            state.passForm.submitted = false;
            state.passForm.nickname = (state.passForm.nickname || '').trim() || 'นักเดินทางแห่งแสงสี';
            state.view = 'RESULT';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (action === 'download-card' && state.outcome) {
            state.isExporting = true;
            render();
            generateShareCardPng(state.outcome, state.passForm.nickname)
              .then((url) => {
                const a = document.createElement('a');
                a.href = url;
                a.download = `ImagineCity-${state.outcome.primaryTrack.code}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
              })
              .finally(() => {
                state.isExporting = false;
                render();
              });
          } else if (action === 'copy-share' && state.outcome) {
            const title = state.outcome.hybridTitle || state.outcome.primaryTrack.personaTitle;
            const txt = `ฉันกู้คืนสีสันให้ Imagine City สำเร็จแล้ว! ฉายาของฉันคือ "${title}" · สาขา ${state.outcome.primaryTrack.majorName} (${state.outcome.primaryTrack.code}) ณ School of Digital Media (SDM)`;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(txt).then(() => {
                state.copied = true;
                render();
                setTimeout(() => {
                  state.copied = false;
                  render();
                }, 2200);
              }).catch(() => {});
            }
          }
        });

        window.addEventListener('keydown', (e) => {
          if (state.view !== 'QUIZ') return;
          if (state.showDistrictUnlockModal && e.key === 'Enter') {
            state.showDistrictUnlockModal = false;
            state.stepIndex = 5;
            render();
            return;
          }
          const num = Number(e.key);
          const scene = getCurrentScene();
          if (num >= 1 && num <= scene.choices.length) {
            const choice = scene.choices[num - 1];
            if (state.selectedChoice) {
              commitChoice(state.selectedChoice);
              return;
            }
            soundFX.playChoice();
            state.selectedChoice = choice;
            render();
            state.advanceTimer = setTimeout(() => commitChoice(choice), 850);
          }
        });

        // Boot: Detect whether assets live at ./assets/aistudio/, /assets/aistudio/ (Vercel), or ./public/assets/aistudio/ (VS Code Live Server root)
        (async function boot() {
          const candidates = [
            './assets/aistudio/',
            '/assets/aistudio/',
            './public/assets/aistudio/',
          ];
          for (const prefix of candidates) {
            try {
              const res = await fetch(prefix + LOGO_FILE, { method: 'HEAD' });
              const ctype = (res.headers.get('content-type') || '').toLowerCase();
              if (res.ok && ctype.startsWith('image/')) {
                ASSET_PREFIX = prefix;
                break;
              }
            } catch (_) {}
          }
          render();
        })();
      })();
    </script>
  </body>
</html>
